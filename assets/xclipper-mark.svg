<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="xc-band">
      <rect x="0" y="8" width="128" height="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#xc-band)">
    <g transform="rotate(38 64 64)" stroke-width="7.5" fill="none" stroke-linecap="butt">
      <line x1="52" y1="-50" x2="52" y2="178" stroke="#1d9bf0"/>
      <line x1="64" y1="-50" x2="64" y2="178" stroke="#7C3AED"/>
      <line x1="76" y1="-50" x2="76" y2="178" stroke="#dc2626"/>
    </g>
  </g>
  <!-- The clip is drawn twice: a wide near-white casing, then a narrower black
       core on top. On a light surface the casing disappears into the background
       and you see the black clip; on a dark one the black core recedes and the
       casing carries the shape. One mark stays legible on any background, so
       there is no light/dark icon pair to switch between. -->
  <g fill="none" transform="rotate(52 64 64)">
    <rect x="2" y="51" width="124" height="26" rx="13" stroke="#F8FAFC" stroke-width="16"/>
    <rect x="2" y="51" width="124" height="26" rx="13" stroke="#000000" stroke-width="8"/>
  </g>
</svg>
