<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 44" width="168" height="44" role="img" aria-label="2,000+ users">
  <style>
    .pill { fill: #e6f4ea; stroke: #b7dfc3; }
    .fg { fill: #137333; }
    @media (prefers-color-scheme: dark) {
      .pill { fill: #0d2818; stroke: #1e5631; }
      .fg { fill: #81c995; }
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 16px;
    }
  </style>

  <rect class="pill" x="0.5" y="0.5" width="167" height="43" rx="21.5"/>

  <!-- Two-person glyph, sized to sit level with the rosette in featured-badge.svg -->
  <g class="fg" transform="translate(16 10)">
    <circle cx="16.5" cy="8" r="2.6"/>
    <path d="M14 13.4 A5 5 0 0 1 21.5 18 V19.5 H16.8 C16.8 16.9 15.8 14.8 14 13.4 Z"/>
    <circle cx="9" cy="7" r="3.2"/>
    <path d="M2.5 19.5 C2.5 15.6 5.4 13 9 13 C12.6 13 15.5 15.6 15.5 19.5 Z"/>
  </g>

  <!-- textLength pins the width so the pill fits whichever system font renders it -->
  <text class="label fg" x="48" y="27.5" textLength="100" lengthAdjust="spacingAndGlyphs">2,000+ users</text>
</svg>
